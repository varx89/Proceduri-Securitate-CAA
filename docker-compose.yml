services:

  traefik:
    image: traefik:v3.0
    container_name: traefik

    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # HTTP only
      - "--entrypoints.web.address=:80"

    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    restart: always

  mysql:
    image: mysql:8.4
    container_name: proceduri_mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-schimba-parola}
      MYSQL_DATABASE: proceduri

    volumes:
      - mysql_data:/var/lib/mysql
      # Imported only on first start (empty volume): schema + migrated data
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

    restart: always

  nextjs:
    build: .
    container_name: proceduri_app

    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-schimba-parola}@mysql:3306/proceduri

    depends_on:
      mysql:
        condition: service_healthy

    labels:
      - "traefik.enable=true"

      # DOMAIN LOCAL
      - "traefik.http.routers.proceduri.rule=Host(`proceduri.caa.local`)"

      # ENTRYPOINT
      - "traefik.http.routers.proceduri.entrypoints=web"

      # APP PORT
      - "traefik.http.services.proceduri.loadbalancer.server.port=3000"

    volumes:
      - ./public/uploads:/app/public/uploads

    restart: always

volumes:
  mysql_data:
